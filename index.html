<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#25282b" />
    <meta
      name="description"
      content="Doleti u Dido — mala mobile-first endless flyer igra o golubu koji leti iznad grada."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325282b'/%3E%3Cpath d='M18 15h25v34H18z' fill='%23f5b82e'/%3E%3Cpath d='M43 23h7v18h-7' fill='none' stroke='%23f5b82e' stroke-width='6'/%3E%3Cpath d='M18 15h25v8H18z' fill='%23fff4c4'/%3E%3C/svg%3E"
    />
    <title>Doleti u Dido</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Doleti u Dido — endless flyer igra">
      <canvas id="game-canvas" aria-label="Prostor igre"></canvas>

      <section id="loading-screen" class="screen screen-loading" aria-label="Učitavanje igre">
        <img class="loading-image" src="./assets/images/bird/bird_image.svg" alt="Doleti u Dido" />
        <p class="loading-line">loading</p>
        <p class="loading-line loading-tap" hidden>tap</p>
      </section>

      <section id="hud" class="hud" aria-label="Rezultat igre" hidden>
        <div class="hud-block hud-health" aria-label="Životi">
          <svg class="health-heart" viewBox="0 0 24 24" aria-label="Život 1"><path d="M12 21S3 15.2 3 8.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 9 2.5C21 15.2 12 21 12 21Z"/></svg>
          <svg class="health-heart" viewBox="0 0 24 24" aria-label="Život 2"><path d="M12 21S3 15.2 3 8.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 9 2.5C21 15.2 12 21 12 21Z"/></svg>
          <svg class="health-heart" viewBox="0 0 24 24" aria-label="Život 3"><path d="M12 21S3 15.2 3 8.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 9 2.5C21 15.2 12 21 12 21Z"/></svg>
        </div>
        <div class="hud-block hud-beer" aria-label="Skupljene pive">
          <span class="beer-icon" aria-hidden="true"></span>
          <strong id="beer-value">0</strong>
        </div>
        <div class="hud-block hud-coffee" aria-label="Skupljene kave">
          <span class="coffee-icon" aria-hidden="true">
            <span class="coffee-steam"></span>
          </span>
          <strong id="coffee-value">0</strong>
        </div>
      </section>

      <section id="start-screen" class="screen screen-start">
        <div class="brand-mark" aria-hidden="true">
          <span class="wing wing-left"></span>
          <span class="mug"><span></span></span>
          <span class="wing wing-right"></span>
        </div>
        <p class="eyebrow">&nbsp;</p>
        <h1>Doleti<br />u Dido</h1>
        <p class="screen-copy">Drži goluba u zraku.</p>
        <button id="play-button" class="primary-button" type="button">
          <span>IGRAJ</span>
          <span aria-hidden="true">→</span>
        </button>
        <p class="control-hint"><span>Tap</span> ili <kbd>Space</kbd> za zamah</p>
      </section>

      <section id="game-over-screen" class="screen screen-over" hidden>
        <p class="eyebrow">LET JE ZAVRŠEN</p>
        <h2>KRAJ<br />RUNDE</h2>
        <div class="results" aria-label="Rezultati runde">
          <div class="result-main">
            <span>UKUPNO</span>
            <strong id="final-score">0</strong>
          </div>
          <div>
            <span>PIVE</span>
            <strong id="final-beers">0</strong>
          </div>
          <div>
            <span>KAVE</span>
            <strong id="final-coffees">0</strong>
          </div>
        </div>
        <button id="replay-button" class="primary-button" type="button">
          <span>PONOVNO</span>
          <span aria-hidden="true">↻</span>
        </button>
      </section>

      <section id="pause-overlay" class="pause-overlay" hidden>
        <h2>PAUZA</h2>
        <p>Pritisni Esc ili P za nastavak</p>
      </section>

      <div id="touch-prompt" class="touch-prompt" hidden aria-hidden="true">
        TAPNI ZA ZAMAH
      </div>
    </main>

    <script src="./assets/backgrounds/renderer.js"></script>
    <script src="./src/debuglos.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
